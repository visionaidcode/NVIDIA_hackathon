[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-screen-assistant"
version = "0.1.0"
description = "Ask what was just shown and said in a video meeting. Answers are spoken aloud. Built for blind and low-vision users."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "Pillow>=10.0",
    "mss>=9.0",
    "soxr>=0.3",
    # Runs the bundled Silero VAD model (app/audio/data/silero_vad.onnx).
    "onnxruntime>=1.17",
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
    "keyboard>=0.13",
    "pyttsx3>=2.90",
    # Native Windows controls, which NVDA and JAWS read reliably.
    "wxPython>=4.2.2",
]

[project.optional-dependencies]
# PyTorch build of Silero VAD. Not needed: the ONNX model is bundled and used first.
vad-torch = ["silero-vad>=5.1"]
# NVDA / JAWS output through their own APIs.
screenreader = ["accessible_output2>=0.17"]
eval = ["jiwer>=3.0"]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.audio" = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
